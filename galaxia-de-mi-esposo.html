<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Galaxia para mi esposo</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden}
    #galaxy-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
    
    .pill{
      position:fixed;top:18px;left:50%;transform:translateX(-50%);
      padding:10px 22px;border-radius:999px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,200,255,0.35);
      color:#fff;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial;
      box-shadow:0 0 20px rgba(255,150,255,0.25);
      backdrop-filter:blur(8px);
      z-index:10;
    }
    
    .attribution{
      position:fixed;left:14px;bottom:70px;
      font-size:12px;color:#d4b8ff;opacity:.85;
      background:rgba(0,0,0,.4);padding:7px 12px;border-radius:10px;
      z-index:10;
    }
    
    .player{
      position:fixed;left:12px;right:12px;bottom:12px;
      display:flex;gap:10px;align-items:center;
      background:rgba(25,15,40,.55);
      border:1px solid rgba(255,255,255,.15);
      border-radius:16px;padding:10px 14px;
      backdrop-filter:blur(10px);
      color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial;
      z-index:10;
    }
    .player button{
      padding:9px 16px;border-radius:12px;
      border:1px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.1);color:#fff;
      cursor:pointer;font-size:14px;
    }
    .player button:hover{background:rgba(255,255,255,.2)}
    .player input[type=file]{display:none}
    
    .error{
      position:fixed;inset:auto 14px 90px 14px;
      background:#2a0018;color:#ffd6f5;
      border:1px solid #ff8ae5;border-radius:12px;
      padding:12px;font:13px system-ui;display:none;
      z-index:20;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<canvas id="galaxy-canvas"></canvas>

<div class="pill">Para el amor de mi vida ❤️</div>
<div class="attribution">Hecho con mucho amor para mi esposo 🌌💕</div>
<div id="err" class="error"></div>

<div class="player">
  <button id="playBtn">▶︎</button>
  <span style="font-size:13px;opacity:.9">Elige tu canción favorita</span>
  <input type="file" id="pickFile" accept="audio/*">
  <button id="pickBtn">Elegir canción</button>
  <audio id="audio" preload="none"></audio>
</div>

<canvas id="fx" style="position:fixed;inset:0;pointer-events:none;z-index:5;"></canvas>

<script>
(function(){
  const err = document.getElementById('err');
  function showError(msg){ err.textContent = msg; err.style.display='block'; }

  // ====== AUDIO ======
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const pickBtn = document.getElementById('pickBtn');
  const pickFile = document.getElementById('pickFile');

  playBtn.onclick = async () => {
    try {
      if (audio.paused) { await audio.play(); playBtn.textContent='⏸︎'; }
      else { audio.pause(); playBtn.textContent='▶︎'; }
    } catch(e){ showError('Toca “Elegir canción” y selecciona tu MP3.'); }
  };
  pickBtn.onclick = () => pickFile.click();
  pickFile.onchange = () => {
    if (pickFile.files && pickFile.files[0]) {
      const url = URL.createObjectURL(pickFile.files[0]);
      audio.src = url;
      audio.play().then(()=> playBtn.textContent='⏸︎').catch(()=>{});
    }
  };

  // ====== WEBGL CHECK ======
  try {
    const test = document.createElement('canvas').getContext('webgl') || document.createElement('canvas').getContext('experimental-webgl');
    if(!test) throw new Error('WebGL no disponible');
  } catch(e) {
    showError('WebGL parece desactivado. Prueba con Chrome o Edge.');
    return;
  }

  // ====== THREE.JS ======
  try {
    const canvas = document.getElementById('galaxy-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 12;
    controls.maxDistance = 240;
    controls.target.set(0,0,0);

    function setCam(){
      const w = window.innerWidth, h = window.innerHeight;
      const isMobile = w < 768 || w < h;
      camera.fov = isMobile ? 90 : 75;
      camera.position.set(0, isMobile? 28 : 24, isMobile? 120 : 85);
      camera.updateProjectionMatrix();
      controls.update();
    }
    setCam();
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      setCam();
    });

    // Fondo de estrellas
    function makePrettyStarTexture(size=1024, count=2200) {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const g = c.getContext('2d');
      const r = size/2;
      const bg = g.createRadialGradient(r,r, r*0.15, r,r, r);
      bg.addColorStop(0,'#0a0018');
      bg.addColorStop(1,'#000000');
      g.fillStyle = bg; g.fillRect(0,0,size,size);

      for (let i=0;i<count;i++) {
        const x = Math.random()*size, y = Math.random()*size;
        const base = Math.random()*0.75 + 0.25;
        const glow = g.createRadialGradient(x,y,0, x,y, Math.random()*2.4+1.4);
        let colInner = 'rgba(255,255,255,'+(0.7*base)+')';
        let colOuter = 'rgba(190,180,255,'+(0.14*base)+')';
        if (Math.random() < 0.3) colOuter = 'rgba(255,170,230,'+(0.14*base)+')';
        glow.addColorStop(0, colInner);
        glow.addColorStop(1, colOuter);
        g.fillStyle = glow;
        g.beginPath(); g.arc(x,y, Math.random()*1.3+0.5, 0, Math.PI*2); g.fill();
      }
      return new THREE.CanvasTexture(c);
    }

    const bgGeo = new THREE.SphereGeometry(650, 64, 64);
    const starTex = makePrettyStarTexture(1024, 2800);
    starTex.wrapS = starTex.wrapT = THREE.RepeatWrapping;
    const bg = new THREE.Mesh(bgGeo, new THREE.MeshBasicMaterial({
      map: starTex, side: THREE.BackSide, transparent:false, opacity:0.9
    }));
    scene.add(bg);

    // Galaxia
    const galaxy = new THREE.Group();
    scene.add(galaxy);

    // Frases
    const phrases = [
      "Te amo infinito ♾️",
      "Mi rey 👑",
      "Mi todo",
      "Mi sol ☀️",
      "Mi cielo 🌌",
      "Mi mejor amigo",
      "Siempre juntos",
      "Mi vida",
      "Mi tesoro 💛",
      "Mi amor eterno",
      "Mi hogar",
      "Mi felicidad",
      "Mi razón de ser",
      "Mi estrella",
      "Mi universo"
    ];

    // ⭐ TUS FOTOS YA ESTÁN PUESTAS ⭐
    const fotos = [
      "https://i.postimg.cc/GTt11b0Y/photo1.jpg",
      "https://i.postimg.cc/1VXZZyx0/photo2.jpg",
      "https://i.postimg.cc/64qNNBsC/photo3.jpg",
      "https://i.postimg.cc/F1HvSVYP/photo4.jpg",
      "https://i.postimg.cc/jn2rrRVH/photo5.jpg",
      "https://i.postimg.cc/XXYW5krP/photo6.jpg"
    ];

    const phraseCount = Math.max(phrases.length * 7, 200);
    const arms = 5, radius = 88, maxH = 24;

    function makeTextTexture(text, size=46){
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 128;
      const g = c.getContext('2d');
      g.clearRect(0,0,c.width,c.height);
      g.font = '800 ' + size + 'px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.shadowColor = 'rgba(220,140,255,0.95)';
      g.shadowBlur = 22;
      g.fillStyle = 'rgba(255,245,255,0.98)';
      g.fillText(text, c.width/2, c.height/2);
      return new THREE.CanvasTexture(c);
    }

    function makePhotoTexture(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = 512; c.height = 512;
          const g = c.getContext('2d');

          const grad = g.createRadialGradient(256,256,80, 256,256,256);
          grad.addColorStop(0, 'rgba(255,200,255,0.35)');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = grad;
          g.fillRect(0,0,512,512);

          g.save();
          g.beginPath();
          g.arc(256, 256, 210, 0, Math.PI * 2);
          g.closePath();
          g.clip();
          g.drawImage(img, 0, 0, 512, 512);
          g.restore();

          g.beginPath();
          g.arc(256, 256, 210, 0, Math.PI * 2);
          g.strokeStyle = 'rgba(255,210,255,0.95)';
          g.lineWidth = 14;
          g.stroke();

          g.beginPath();
          g.arc(256, 256, 222, 0, Math.PI * 2);
          g.strokeStyle = 'rgba(200,150,255,0.45)';
          g.lineWidth = 8;
          g.stroke();

          resolve(new THREE.CanvasTexture(c));
        };
        img.onerror = () => {
          const c = document.createElement('canvas');
          c.width = 512; c.height = 512;
          const g = c.getContext('2d');
          g.fillStyle = '#ff9ad5';
          g.beginPath(); g.arc(256,256,200,0,Math.PI*2); g.fill();
          resolve(new THREE.CanvasTexture(c));
        };
        img.src = url;
      });
    }

    (async function createGalaxy() {
      const photoTextures = await Promise.all(fotos.map(f => makePhotoTexture(f)));

      for (let i = 0; i < phraseCount; i++) {
        let spr;

        if (i % 5 === 0 && photoTextures.length > 0) {
          const tex = photoTextures[i % photoTextures.length];
          spr = new THREE.Sprite(new THREE.SpriteMaterial({
            map: tex,
            transparent: true,
            depthWrite: false
          }));
          spr.scale.set(15, 15, 1);
        } else {
          const text = phrases[i % phrases.length];
          const tex = makeTextTexture(text, 46);
          spr = new THREE.Sprite(new THREE.SpriteMaterial({
            map: tex,
            transparent: true,
            depthWrite: false
          }));
          spr.scale.set(19, 2.5, 1);
        }

        const perArm = phraseCount / arms;
        const ang = (i % perArm) * (Math.PI * 2 / perArm);
        const armAng = Math.floor(i / perArm) * (Math.PI * 2 / arms);
        const dist = Math.pow(i / phraseCount, 0.72) * radius;
        const thickness = Math.pow(1 - (dist / radius), 2);
        const x = Math.cos(ang + armAng) * dist;
        const z = Math.sin(ang + armAng) * dist;
        const y = (Math.random() - 0.5) * maxH * thickness * 0.9;

        spr.position.set(x, y, z);
        galaxy.add(spr);
      }
    })();

    // Estrellas
    const starCount = 9000;
    const geom = new THREE.BufferGeometry();
    const pos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const ang = Math.random() * Math.PI * 2;
      const dist = Math.random() * radius * 1.2;
      const y = (Math.random() - 0.5) * 38 * Math.pow(1 - Math.min(dist, radius) / radius, 1.5);
      pos[i*3] = Math.cos(ang) * dist;
      pos[i*3+1] = y;
      pos[i*3+2] = Math.sin(ang) * dist;
    }
    geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    galaxy.add(new THREE.Points(geom, new THREE.PointsMaterial({
      color: 0xffffff, size: 0.26, transparent: true, opacity: 0.7,
      blending: THREE.AdditiveBlending
    })));

    // Núcleo
    const coreR = 13;
    const coreTexCanvas = document.createElement('canvas');
    coreTexCanvas.width = coreTexCanvas.height = 256;
    const cg = coreTexCanvas.getContext('2d');
    const grd = cg.createRadialGradient(128,128,8, 128,128,128);
    grd.addColorStop(0, '#1a0025');
    grd.addColorStop(0.55, '#0a0012');
    grd.addColorStop(1, '#000');
    cg.fillStyle = grd;
    cg.beginPath(); cg.arc(128,128,128,0,Math.PI*2); cg.fill();
    const core = new THREE.Mesh(
      new THREE.SphereGeometry(coreR, 64, 64),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(coreTexCanvas) })
    );
    core.renderOrder = 1;
    scene.add(core);

    // Anillo
    const photonRing = new THREE.Mesh(
      new THREE.RingGeometry(coreR * 1.06, coreR * 1.22, 128),
      new THREE.MeshBasicMaterial({
        color: 0xEAAEFF, transparent: true, opacity: 0.95, side: THREE.DoubleSide
      })
    );
    photonRing.rotation.x = -Math.PI / 2;
    photonRing.renderOrder = 0.5;
    scene.add(photonRing);

    // Halo
    function makeHaloTexture(size=1024, inner=0.42){
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      const r = size/2;
      const grd = g.createRadialGradient(r,r, r*inner, r,r, r);
      grd.addColorStop(0.0, 'rgba(255,190,240,0.5)');
      grd.addColorStop(0.35, 'rgba(210,160,255,0.38)');
      grd.addColorStop(0.7, 'rgba(150,180,255,0.25)');
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd;
      g.fillRect(0,0,size,size);
      return new THREE.CanvasTexture(c);
    }
    const haloPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(340, 340),
      new THREE.MeshBasicMaterial({
        map: makeHaloTexture(1024, 0.42),
        transparent: true, depthWrite: false,
        blending: THREE.AdditiveBlending, opacity: 0.92
      })
    );
    haloPlane.rotation.x = -Math.PI / 2;
    haloPlane.renderOrder = 0.2;
    scene.add(haloPlane);

    // Animación
    let tw = 0;
    function animate(){
      requestAnimationFrame(animate);
      const t = performance.now() * 0.001;
      tw = (tw + 0.00025) % 1;
      starTex.offset.set(tw, 0);
      galaxy.rotation.y = t * 0.045;
      core.rotation.y = t * 0.11;
      photonRing.rotation.z = t * 0.16;
      haloPlane.rotation.z = t * 0.018;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Corazones
    const fx = document.getElementById('fx');
    const ctx2 = fx.getContext('2d');
    function resizeFx(){
      fx.width = Math.floor(innerWidth * Math.min(2, window.devicePixelRatio||1));
      fx.height = Math.floor(innerHeight * Math.min(2, window.devicePixelRatio||1));
      fx.style.width = innerWidth + 'px';
      fx.style.height = innerHeight + 'px';
    }
    addEventListener('resize', resizeFx); resizeFx();
    const DPR = Math.min(2, window.devicePixelRatio || 1);
    const hearts = [];
    function spawnHearts(x,y,n=22){
      x *= DPR; y *= DPR;
      for(let i=0;i<n;i++){
        const a = Math.random()*Math.PI*2;
        hearts.push({
          x, y,
          vx: Math.cos(a)*(0.55+Math.random()*0.9),
          vy: -(0.7+Math.random()*1.3),
          life: 1,
          size: 11+Math.random()*18
        });
      }
    }
    function drawHeart(x,y,size){
      const s = size;
      ctx2.save();
      ctx2.translate(x,y);
      ctx2.beginPath();
      ctx2.moveTo(0, -0.25*s);
      ctx2.bezierCurveTo(0.5*s, -0.9*s, 1.4*s, -0.1*s, 0, 0.9*s);
      ctx2.bezierCurveTo(-1.4*s, -0.1*s, -0.5*s, -0.9*s, 0, -0.25*s);
      const g = ctx2.createRadialGradient(0,0,0, 0,0,s);
      g.addColorStop(0, 'rgba(255,180,220,0.95)');
      g.addColorStop(1, 'rgba(255,80,160,0)');
      ctx2.fillStyle = g;
      ctx2.fill();
      ctx2.restore();
    }
    let lastTap = 0;
    addEventListener('click', (e)=>{
      const now = performance.now();
      if(now - lastTap < 320) spawnHearts(e.clientX, e.clientY, 22);
      lastTap = now;
    }, {passive:true});
    addEventListener('touchend', (e)=>{
      const now = performance.now();
      const t = e.changedTouches && e.changedTouches[0];
      if(now - lastTap < 320 && t) spawnHearts(t.clientX, t.clientY, 22);
      lastTap = now;
    }, {passive:true});

    function loopFx(){
      ctx2.clearRect(0,0,fx.width,fx.height);
      for(let i=hearts.length-1; i>=0; i--){
        const h = hearts[i];
        h.x += h.vx; h.y += h.vy; h.vy -= 0.018; h.life -= 0.013;
        ctx2.globalAlpha = Math.max(0, h.life);
        drawHeart(h.x, h.y, h.size);
        ctx2.globalAlpha = 1;
        if(h.life <= 0) hearts.splice(i,1);
      }
      requestAnimationFrame(loopFx);
    }
    loopFx();

  } catch(e) {
    showError('Error cargando la galaxia: ' + e.message);
    console.error(e);
  }
})();
</script>
</body>
</html>
